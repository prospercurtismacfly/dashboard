<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<style>
:root{--tx:#f4eefc;--mu:#b3a5d3;--pk:#ff2d9b;--ac:#ff2d9b;--a1:#6a2cff;--a2:#ff2d9b}
*{box-sizing:border-box;margin:0}
html{background:#0d0722}
html,body{height:100%;color:var(--tx);font-family:"Avenir Next Condensed","Oswald","Arial Narrow",-apple-system,sans-serif;overflow:hidden;font-size:15px}
body{display:flex;flex-direction:row;padding:max(14px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom));grid-gap:14px;gap:14px}
body::before{content:"";position:fixed;top:-25%;right:-25%;bottom:-25%;left:-25%;z-index:-1;background:radial-gradient(40% 40% at 20% 25%,var(--a1),transparent 70%),radial-gradient(45% 45% at 80% 75%,var(--a2),transparent 70%);opacity:.32;filter:blur(40px);animation:drift 40s ease-in-out infinite alternate;transition:opacity 2s}
@keyframes drift{from{transform:translate3d(-4%,-3%,0) rotate(0)}to{transform:translate3d(5%,4%,0) rotate(8deg)}}
body.night::before{opacity:.06}
#al{position:fixed;top:max(12px,env(safe-area-inset-top));left:92px;right:16px;z-index:20;border-radius:999px;padding:10px 24px;font-weight:600;font-size:17px;box-shadow:0 0 24px rgba(255,45,155,.35)}
#al small{font-weight:400;opacity:.8;margin-left:10px}
#al.y{background:linear-gradient(90deg,#ffb347,#ff7a45);color:#2a1200}#al.o{background:linear-gradient(90deg,#ff7a45,#ff2d9b);color:#fff}#al.r{background:linear-gradient(90deg,#ff2d6a,#b0125f);color:#fff}
body.has-alert .main-wrap{padding-top:52px}
.main-wrap{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;transition:padding-top .25s ease}

/* Barre latérale gauche */
#snav{width:68px;flex:none;display:flex;flex-direction:column;justify-content:center;grid-gap:14px;gap:14px;padding:10px 6px;background:linear-gradient(180deg,rgba(78,22,96,.72),rgba(22,10,46,.88));border:1px solid rgba(255,255,255,.08);border-radius:28px;box-shadow:0 14px 32px rgba(5,0,20,.45)}
#snav button{-webkit-appearance:none;appearance:none;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:var(--mu);border-radius:20px;padding:12px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;grid-gap:4px;gap:4px;font-family:inherit;transition:all .3s ease}
#snav button span{display:flex;align-items:center;justify-content:center;width:28px;height:28px;line-height:1;color:var(--mu);transition:transform .3s ease,color .3s ease,filter .3s ease}
#snav button span svg{width:22px;height:22px;overflow:visible}
#snav button:hover span{color:#fff}
#snav button.on span{color:#fff;transform:scale(1.08);filter:drop-shadow(0 0 8px rgba(255,45,155,.75))}
body.night #snav button.on span{filter:drop-shadow(0 0 4px rgba(255,45,155,.35)) brightness(.8)}
#snav button small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
#snav button:hover{color:#fff;background:rgba(255,255,255,.1)}
#snav button.on{color:#fff;background:linear-gradient(155deg,rgba(255,45,155,.34),rgba(138,61,255,.34));border-color:rgba(255,45,155,.75);box-shadow:0 0 18px rgba(255,45,155,.35)}

.g{position:relative;flex:1;min-height:0}
.scene{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;grid-gap:12px;gap:12px;opacity:0;visibility:hidden;transform:scale(.985);transition:opacity .7s ease,transform .7s ease,visibility 0s .7s}
.scene.on{opacity:1;visibility:visible;transform:none;transition:opacity .7s ease,transform .7s ease}
.scene.on .c{animation:in .75s cubic-bezier(.2,.7,.2,1) both}
.scene.on .c:nth-child(2){animation-delay:.1s}.scene.on .c:nth-child(3){animation-delay:.2s}.scene.on .c:nth-child(n+4){animation-delay:.28s}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.clock{grid-area:clock}.wx{grid-area:wx}.hr{grid-area:hr}.eph{grid-area:eph}.air{grid-area:air}.news{grid-area:news}.bd{grid-area:bd}.rugby{grid-area:rugby}.foot{grid-area:foot}
.c{position:relative;background:linear-gradient(150deg,rgba(78,22,96,.93),rgba(38,14,66,.95) 50%,rgba(22,10,46,.97));border:1px solid rgba(255,255,255,.07);border-radius:26px;padding:14px 20px;display:flex;flex-direction:column;min-height:0;overflow:hidden;box-shadow:0 18px 40px rgba(5,0,20,.45),inset 0 1px 0 rgba(255,255,255,.08)}
.c .n{display:inline-block;font-size:24px;color:var(--pk);font-weight:500;line-height:1;vertical-align:middle}
.c h2{display:inline-block;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#fff;font-weight:600;margin:0 0 0 10px;vertical-align:middle}
.c>h2+*{margin-top:8px}
.rg{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.rg svg{height:100%;max-width:100%;filter:drop-shadow(0 0 7px rgba(255,45,155,.5))}
.eph .ph span{width:24px;height:24px}
.ph{display:flex;justify-content:space-between;margin-top:8px;padding:0}.ph span{width:24px;height:24px;border-radius:50%;opacity:.42;display:block;transition:transform .3s,opacity .3s}.ph span.on{opacity:1;transform:scale(1.12);box-shadow:0 0 0 2px #ff2d9b,0 0 16px rgba(255,45,155,.7)}.ph svg{width:100%;height:100%}
.mid{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#time{font-size:max(34px,min(4.6vw,64px));font-weight:300;letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1}
#date{font-size:max(16px,min(1.85vw,24px));letter-spacing:.06em;text-transform:capitalize;color:#fff;font-weight:500;line-height:1.3;margin-top:8px;text-shadow:0 2px 12px rgba(255,45,155,.35)}
.wtop{display:flex;align-items:center;grid-gap:22px;gap:22px}
.rg2{position:relative;width:150px;height:150px;flex:none}
.rg2>svg{width:100%;height:100%;filter:drop-shadow(0 0 7px rgba(255,45,155,.5))}
.rg2 .mid b{font-size:40px;font-weight:300;line-height:1}.rg2 .mid .wic{width:34px;height:34px;margin-top:2px}
.wd strong{display:block;font-size:26px;font-weight:500;margin-bottom:4px}
.wd p{font-size:16px;color:var(--mu);line-height:1.45}
.days{display:grid;grid-template-columns:repeat(4,1fr);grid-gap:8px;gap:8px;margin-top:auto;text-align:center}
.dy b{display:block;color:#fff;text-transform:uppercase;letter-spacing:.1em;font-size:13px}
.dy span{display:flex;align-items:center;justify-content:center;height:34px;margin:4px 0}.dy .wic{width:34px;height:34px}.dy em{font-style:normal;font-size:17px;display:block;line-height:1.25}
.dy em.mn{color:var(--mu)}
.dy small{color:#ff9ac8;font-size:13px;display:block;margin-top:3px}
.wic{display:inline-block;vertical-align:middle;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.chart{flex:1;min-height:0}.chart svg{width:100%;height:100%;font-family:inherit}
.chart .tv{fill:#fff;font-size:15px;font-weight:500}.chart .pv{fill:#ff9ac8;font-size:11px}.chart .hv{fill:var(--mu);font-size:13px}
.lg{position:absolute;right:24px;top:14px;display:flex;grid-gap:24px;gap:24px;justify-content:center;font-size:13px;color:var(--mu)}
.lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.eph .s{font-size:22px;font-weight:500;line-height:1.15;margin:0;background:linear-gradient(90deg,#ff2d9b,#9a5bff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.eph #mt{text-align:left;margin-top:6px}.eph #mt b{color:#fff;font-weight:500;font-size:19px;letter-spacing:.02em}
.eph #mdates{display:grid;grid-template-columns:1fr 1fr;grid-gap:5px 12px;gap:5px 12px;margin-top:auto;padding-top:6px;font-size:13px;color:var(--mu)}
.eph #mdates span{display:flex;align-items:center;grid-gap:4px;gap:4px;white-space:nowrap}
.eph #mdates b{color:#fff;font-weight:500;margin-left:auto}
#air{display:flex;flex-direction:column;flex:1;min-height:0}
.pollen-alert{display:flex;flex-direction:column;justify-content:center;flex:1;min-height:0;padding:10px 14px;border-radius:18px;background:rgba(255,255,255,.055);text-align:center}
.pollen-alert .pa-icon{font-size:26px;margin:0 0 2px}
.pollen-alert>strong{font-size:19px;font-weight:500;color:#fff}
.pollen-alert>p{display:none}
.pollen-alert ul{list-style:none;padding:0;text-align:left;overflow:auto;margin-top:8px}
.pollen-alert li{display:flex;justify-content:space-between;grid-gap:10px;gap:10px;padding:4px 2px;border-top:1px solid rgba(255,255,255,.09);font-size:15px;color:var(--mu)}
.pollen-alert li b{color:#fff;font-weight:500}
.pollen-alert.low>strong{color:#8ee3ad}.pollen-alert.medium>strong{color:#ffd166}.pollen-alert.high>strong{color:#ff8c9b}

.bd ul{list-style:none;padding:0;display:grid;grid-template-columns:repeat(4,1fr);grid-gap:18px;gap:18px;align-content:center;flex:1;min-height:0}
.bd li{padding:0}
.bd .r{display:flex;flex-wrap:wrap;align-items:baseline;grid-gap:4px 8px;gap:4px 8px;font-size:17px}
.bd em{font-style:normal;color:var(--mu);font-size:15px}.bd strong{order:3;width:100%;margin:0;color:#ff9ac8;font-weight:500;font-size:15px}
.bd .today strong{color:#ffd166}
.pb{flex:none;height:6px;border-radius:3px;background:rgba(255,255,255,.14);margin-top:7px}
.pb i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#8a3dff,#ff2d9b,#ff9a45)}
.bd form{position:absolute;top:10px;right:20px;display:flex;grid-gap:6px;gap:6px;margin:0;padding:0}
.bd input,.bd select{background:rgba(255,255,255,.08);border:0;border-radius:999px;color:var(--tx);padding:6px 12px;font-size:14px;min-width:0;font-family:inherit}
.bd input{width:115px}
.bd select option{background:#1b0b38;color:var(--tx)}
.bd button,.x{background:linear-gradient(135deg,#ff2d9b,#8a3dff);color:#fff;border:0;border-radius:999px;padding:6px 14px;font-weight:600;cursor:pointer}
.bd .x{background:none;color:var(--mu);padding:0 4px;font-size:20px;margin-left:auto}

/* Scènes & cartes d'actualités dynamiques */
.s1{grid-template-columns:1.1fr 1fr 1fr 1fr;grid-template-rows:1.02fr 1.02fr .88fr minmax(82px,.72fr);grid-template-areas:"clock wx wx eph" "clock wx wx air" "hr hr hr hr" "bd bd bd bd"}
.s2{grid-template-columns:1fr;grid-template-areas:"news"}
.s3{grid-template-columns:1fr 1fr;grid-template-areas:"rugby foot"}

.news-grid{flex:1;min-height:0;display:grid;grid-template-columns:1.35fr 1fr 1fr;grid-template-rows:1fr 1fr;grid-gap:12px;gap:12px;margin-top:10px;overflow:auto}
.ncard{position:relative;border-radius:22px;padding:18px 20px;background:linear-gradient(155deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.09);display:flex;flex-direction:column;justify-content:space-between;grid-gap:10px;gap:10px;overflow:hidden;transition:transform .45s cubic-bezier(.2,.8,.2,1),border-color .45s ease,box-shadow .45s ease,background .45s ease}
.ncard::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:radial-gradient(circle at top right,rgba(255,45,155,.16),transparent 65%);opacity:0;transition:opacity .45s ease;pointer-events:none}
.ncard.hero{grid-row:span 2;padding:24px;background:linear-gradient(160deg,rgba(255,45,155,.16),rgba(106,44,255,.14) 55%,rgba(255,255,255,.03));border-color:rgba(255,45,155,.35)}
.ncard.spot{transform:translateY(-3px) scale(1.012);border-color:rgba(255,154,69,.75);box-shadow:0 12px 28px rgba(255,45,155,.22),inset 0 0 0 1px rgba(255,255,255,.12)}
.ncard.spot::before{opacity:1}
.ncard .ntop{display:flex;align-items:center;justify-content:space-between;grid-gap:8px;gap:8px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.ncard .nidx{color:#ff9ac8;font-weight:700;font-size:15px}
.ncard .nbadge{padding:3px 10px;border-radius:999px;background:rgba(255,45,155,.22);color:#ffd6ec;font-size:11px;font-weight:600}
.ncard h3{font-size:18px;line-height:1.28;font-weight:500;color:#fff;overflow-wrap:anywhere}
.ncard.hero h3{font-size:25px;line-height:1.25}
.ncard .nfoot{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--mu)}
.ncard .npulse{width:8px;height:8px;border-radius:50%;background:#ff9ac8;box-shadow:0 0 10px #ff9ac8;opacity:.45;transition:opacity .35s,transform .35s}
.ncard.spot .npulse{opacity:1;transform:scale(1.3)}

.sport-list{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-gap:12px;gap:12px;margin-top:10px;overflow:auto;padding-right:2px}
.scard{border-radius:20px;padding:15px 17px;background:linear-gradient(155deg,rgba(255,255,255,.065),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;justify-content:space-between;grid-gap:8px;gap:8px;transition:transform .35s ease,border-color .35s ease,box-shadow .35s ease}
.scard.spot{transform:translateY(-2px);border-color:rgba(255,154,69,.7);box-shadow:0 10px 22px rgba(255,45,155,.18)}
.scard .shead{display:flex;align-items:center;justify-content:space-between;grid-gap:8px;gap:8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#ff9ac8;font-weight:600}
.scard h3{font-size:16.5px;line-height:1.25;font-weight:500;color:#fff;overflow-wrap:anywhere}
.scard .smeta{font-size:13px;color:var(--mu)}

.night .g,.night #al,.night #snav{filter:brightness(.42)}
@media (prefers-reduced-motion:reduce){body::before,.scene.on .c,.ncard,.scard{animation:none;transition:none}}
@media (max-width:1180px) and (orientation: portrait){
  .s1{grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto auto;grid-template-areas:"clock eph" "wx air" "hr hr" "bd bd"}
  .s3{grid-template-columns:1fr;grid-template-areas:"rugby" "foot"}
  .bd ul{grid-template-columns:repeat(2,1fr)}
  .bd form{position:static;margin-top:10px;flex-wrap:wrap}
  .news-grid{grid-template-columns:repeat(2,1fr);grid-template-rows:auto}
  .ncard.hero{grid-column:span 2;grid-row:auto}
  body{overflow:auto;height:auto;min-height:100%}
  .g{min-height:680px}
}

@media (max-height:920px) and (min-width:901px){
  body{padding:10px 14px;grid-gap:10px;gap:10px;font-size:14px}
  #snav{width:64px;grid-gap:10px;gap:10px;padding:8px 5px}
  .c{padding:10px 16px;border-radius:22px}
  .c>h2+*{margin-top:5px}
  #time{font-size:max(32px,min(3.8vw,52px))}
  #date{font-size:max(15px,min(1.5vw,21px))}
  .rg2{width:124px;height:124px}
  .rg2 .mid b{font-size:34px}
  .wd strong{font-size:22px}
  .wd p{font-size:14px}
  .bd ul{grid-gap:12px;gap:12px}
  .bd .r{font-size:15px}
  .bd .r strong{font-size:14px}
  .pb{margin-top:5px}
}

@media (max-width:1180px) and (min-height:921px){
  .s1{grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto auto;grid-template-areas:"clock eph" "wx air" "hr hr" "bd bd"}
  .s3{grid-template-columns:1fr;grid-template-areas:"rugby" "foot"}
  .bd ul{grid-template-columns:repeat(2,1fr)}
  .bd form{position:static;margin-top:10px;flex-wrap:wrap}
  .news-grid{grid-template-columns:repeat(2,1fr);grid-template-rows:auto}
  .ncard.hero{grid-column:span 2;grid-row:auto}
  body{overflow:auto;height:auto;min-height:100%}
  .g{min-height:680px}
}

@media (max-width:900px){
  body{overflow:auto;height:auto;min-height:100%;display:block;padding:12px}
  #al{position:static;margin-bottom:10px;border-radius:18px;font-size:15px}
  body.has-alert .main-wrap{padding-top:0}
  #snav{position:sticky;top:8px;z-index:15;width:100%;flex-direction:row;grid-gap:8px;gap:8px;padding:6px;margin-bottom:12px;border-radius:20px}
  #snav button{flex:1;padding:8px 4px;border-radius:14px}
  .g{margin:0;min-height:0}
  .scene{position:static;display:none;grid-template-columns:1fr;grid-template-rows:auto;grid-template-areas:none;opacity:1;visibility:visible;transform:none}
  .scene.on{display:grid}
  .s1,.s2,.s3{grid-template-columns:1fr;grid-template-areas:none}
  .scene .c{grid-area:auto;margin-bottom:4px;overflow:visible}
  .rg{min-height:190px}
  .wtop{flex-direction:column;align-items:flex-start;grid-gap:12px;gap:12px}
  .days{grid-template-columns:repeat(2,1fr);grid-gap:10px;gap:10px;margin-top:14px}
  .lg{position:static;margin-top:8px;justify-content:flex-start;grid-gap:14px;gap:14px}
  .chart{height:190px;flex:none}
  .news-grid,.sport-list{grid-template-columns:1fr;grid-template-rows:auto;overflow:visible}
  .ncard.hero{grid-column:auto;grid-row:auto;padding:18px}
  .ncard.hero h3{font-size:22px}
  .bd ul{grid-template-columns:1fr;grid-gap:12px;gap:12px}
  .bd form{position:static;margin-top:12px;flex-wrap:wrap}
  .bd input,.bd select,.bd button{flex:1 1 110px}
}

/* === Compatibilité iOS 12 (Safari 12) === */
.nofg #snav{margin-right:12px}
.nofg #snav button+button{margin-top:12px}
.nofg .wtop>*+*{margin-left:22px}
.nofg .lg>*+*{margin-left:24px}
.nofg .eph #mdates span>*+*{margin-left:4px}
.nofg .pollen-alert li>*+*{margin-left:10px}
.nofg .bd .r>*{margin:0 8px 4px 0}
.nofg .bd form>*+*{margin-left:6px}
.nofg .ncard .ntop>*+*,.nofg .scard .shead>*+*{margin-left:8px}
@media (max-width:900px){.nofg #snav{margin-right:0}.nofg #snav button+button{margin-top:0;margin-left:8px}.nofg .wtop>*+*{margin-left:0;margin-top:12px}.nofg .lg>*+*{margin-left:14px}}
.legacy .c{-webkit-backdrop-filter:none;backdrop-filter:none}
.legacy body::before{animation:none;-webkit-filter:none;filter:none;opacity:.22}
.legacy .rg svg,.legacy .rg2 svg,.legacy .rg3 svg{-webkit-filter:none;filter:none}
.legacy .scene.on .c{animation:none}
.legacy .scene{transition:opacity .4s ease}

/* En-têtes de cartes : numéro à gauche, titre sur la même ligne */
.c>.n{position:absolute;top:12px;left:18px;display:block;font-size:24px;line-height:1;margin:0}
.c>h2{display:block;margin:0 0 0 38px;height:24px;line-height:24px}
.c>h2+*{margin-top:10px}
@media (max-width:1100px) and (min-width:901px){
 .eph .s{font-size:19px}
 .eph #mt{margin-top:4px}.eph #mt b{font-size:15px}
 .eph .ph{margin-top:6px}.eph .ph span{width:21px;height:21px}
 .eph #mdates{font-size:11px;grid-gap:3px 8px;gap:3px 8px;padding-top:4px}
 .pollen-alert{padding:8px 12px}.pollen-alert .pa-icon{font-size:16px}.pollen-alert>strong{font-size:15px}.pollen-alert li{padding:3px 2px;font-size:14px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="gA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff2d9b"/><stop offset=".55" stop-color="#b13dff"/><stop offset="1" stop-color="#4d6bff"/></linearGradient>
<linearGradient id="gB" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#8a3dff"/><stop offset=".5" stop-color="#ff2d9b"/><stop offset="1" stop-color="#ff9a45"/></linearGradient>
<linearGradient id="gW" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9a45"/><stop offset=".5" stop-color="#ff2d9b"/><stop offset="1" stop-color="#8a3dff"/></linearGradient>
<linearGradient id="gF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff2d9b" stop-opacity=".4"/><stop offset="1" stop-color="#ff2d9b" stop-opacity="0"/></linearGradient>
